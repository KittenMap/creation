      sizeRow.appendChild(sizeLabel);
      sizeRow.appendChild(segControl(
        [['1x1','半宽 1×1'],['2x1','全宽 2×1']],
        c.size || '1x1',
        function (v) {
          c.size = v;
          card.classList.remove('size-1x1', 'size-2x1');
          card.classList.add('size-' + v);
          save();
          if (c.type === 'profile' || c.type === 'music') render();
        }
      ));
      panel.appendChild(sizeRow);
    }

    panel.appendChild(colorRow('卡片背景', c.bg || '#ffffff', function (v) {
      c.bg = v; card.style.setProperty('--card-bg', v || '#ffffff'); save();
    }));

    if (!['relation','music','quote'].includes(c.type)) {
      panel.appendChild(colorRow('标题背景', c.headBg || '#ffffff', function (v) {
        c.headBg = v; head.style.background = (v && v !== '#ffffff') ? v : ''; save();
      }));
    }

    if (c.type === 'image' && c.img) {
      var cropRow = el('div', 'prow');
      var cropLabel = el('span', 'plabel'); cropLabel.textContent = '图片裁剪';
      cropRow.appendChild(cropLabel);
      var cropBtn = el('button', 'pbtn'); cropBtn.type = 'button'; cropBtn.textContent = '重新裁剪';
      cropBtn.addEventListener('click', function () {
        openCropper({
          src: c.img, aspect: NaN, title: '裁剪图片', maxSize: 1400,
          onConfirm: function (cropped) {
            c.img = cropped; save();
            var wrap = grid.querySelector('[data-id="' + c.id + '"] .img-fill');
            if (wrap) {
              wrap.innerHTML = '';
              var newImg = document.createElement('img');
              newImg.src = cropped; newImg.alt = '';
              wrap.appendChild(newImg);
            } else { render(); }
            reopenPanel(c.id);
            toast('图片已保存');
          }
        });
      });
      cropRow.appendChild(cropBtn);
      panel.appendChild(cropRow);
    }

    if (c.type === 'profile' && c.img) {
      var cropRowP = el('div', 'prow');
      var cropLabelP = el('span', 'plabel'); cropLabelP.textContent = '图片裁剪';
      cropRowP.appendChild(cropLabelP);
      var cropBtnP = el('button', 'pbtn'); cropBtnP.type = 'button'; cropBtnP.textContent = '重新裁剪';
      cropBtnP.addEventListener('click', function () {
        openCropper({
          src: c.img, aspect: NaN, title: '裁剪档案图片', maxSize: 1400,
          onConfirm: function (cropped) {
            c.img = cropped; save(); render();
            reopenPanel(c.id);
            toast('图片已保存');
          }
        });
      });
      cropRowP.appendChild(cropBtnP);
      panel.appendChild(cropRowP);
    }

    if (c.type === 'music') {
      /* 播放键颜色 — 关键：统一更新 --music-theme-color，同时同步进度条、音量滑块 */
      var playColorRow = el('div', 'prow');
      var playColorLabel = el('span', 'plabel'); playColorLabel.textContent = '主题色';
      playColorRow.appendChild(playColorLabel);
      var playColorInput = el('input');
      playColorInput.type = 'color';
      playColorInput.value = c.playColor || '#2f6fed';
      playColorInput.addEventListener('input', function () {
        c.playColor = playColorInput.value;
        /* 更新卡片的主题变量，进度条填充/播放按钮/滑块 thumb 全部同步 */
        card.style.setProperty('--music-theme-color', c.playColor);
        /* 更新滑块渐变填充 */
        card.querySelectorAll('.mp-vol-slider').forEach(function (s) {
          updateVolumeSliderFill(s);
        });
        save();
      });
      playColorRow.appendChild(playColorInput);
      var resetColorBtn = el('button', 'pbtn'); resetColorBtn.type = 'button'; resetColorBtn.textContent = '重置';
      resetColorBtn.addEventListener('click', function () {
        c.playColor = '';
        playColorInput.value = '#2f6fed';
        card.style.setProperty('--music-theme-color', '#2f6fed');
        card.querySelectorAll('.mp-vol-slider').forEach(function (s) {
          updateVolumeSliderFill(s);
        });
        save();
      });
      playColorRow.appendChild(resetColorBtn);
      panel.appendChild(playColorRow);

      var manageRow = el('div', 'prow');
      var manageBtn = el('button', 'pbtn primary'); manageBtn.type = 'button'; manageBtn.textContent = '管理曲库';
      manageBtn.addEventListener('click', function () { openManagePlaylistModal(); });
      manageRow.appendChild(manageBtn);
      panel.appendChild(manageRow);
    }

    if (c.type === 'quote') {
      var qRow = el('div', 'prow');
      var qLabel = el('span', 'plabel'); qLabel.textContent = '引言背景';
      qRow.appendChild(qLabel);
      var qInp = el('input'); qInp.type = 'color'; qInp.value = c.quoteBg || '#f7f5ff';
      qInp.addEventListener('input', function () {
        c.quoteBg = qInp.value;
        var qc = card.querySelector('.quote-card');
        if (qc) qc.style.setProperty('--quote-bg', qInp.value);
        save();
      });
      qRow.appendChild(qInp);
      panel.appendChild(qRow);
    }

    if (c.type === 'tags') {
      panel.appendChild(tagColorRow(c.tagColor || 'blue', function (color) {
        c.tagColor = color;
        save();
        var tags = card.querySelectorAll('.tag-chip');
        tags.forEach(function (chip) { chip.className = 'tag-chip tag-' + color; });
      }));

      var tagsRow = el('div', 'prow');
      var tagsLabel = el('span', 'plabel'); tagsLabel.textContent = '标签内容';
      tagsRow.appendChild(tagsLabel);
      var tagsInput = el('input');
      tagsInput.type = 'text';
      tagsInput.className = 'pinput';
      tagsInput.value = c.tags || '';
      tagsInput.placeholder = '工作,生活,旅行';
      tagsInput.addEventListener('input', function () {
        c.tags = tagsInput.value;
        save();
        var tagsWrap = card.querySelector('.tags-wrap');
        if (tagsWrap) {
          tagsWrap.innerHTML = '';
          var list = tagsInput.value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
          if (!list.length) {
            var e2 = el('p', 'qa-empty'); e2.textContent = '暂无标签';
            tagsWrap.appendChild(e2);
          } else {
            list.forEach(function (t) {
              var chip = el('span', 'tag-chip tag-' + c.tagColor);
              chip.textContent = t;
              tagsWrap.appendChild(chip);
            });
          }
        }
      });
      tagsRow.appendChild(tagsInput);
      panel.appendChild(tagsRow);
    }

    if (c.type === 'album') {
      var upRow = el('div', 'prow');
      var upLabel = el('span', 'plabel'); upLabel.textContent = '添加图片';
      upRow.appendChild(upLabel);
      var upInput = el('input');
      upInput.type = 'file'; upInput.accept = 'image/*'; upInput.multiple = true;
      upInput.style.display = 'none';
      var upBtn = el('button', 'pbtn'); upBtn.type = 'button'; upBtn.textContent = '+ 上传图片';
      upBtn.addEventListener('click', function () { upInput.click(); });
      upInput.addEventListener('change', function () {
        var files = upInput.files || [];
        if (!files.length) return;
        readMultipleImages(files, 1400, function (urls) {
          urls.forEach(function (src) { c.images.push({ src: src }); });
          save(); render();
          reopenPanel(c.id);
          toast('已添加 ' + urls.length + ' 张');
        });
        upInput.value = '';
      });
      upRow.appendChild(upInput); upRow.appendChild(upBtn);
      panel.appendChild(upRow);

      c.images.forEach(function (imgData, idx) {
        var item = el('div', 'album-edit-item');
        var thumb = el('div', 'album-thumb');
        var timg = el('img'); timg.src = imgData.src;
        thumb.appendChild(timg);
        if (idx === c.coverIndex) {
          var badge = el('div', 'cover-badge'); badge.textContent = '封面';
          thumb.appendChild(badge);
        }
        item.appendChild(thumb);

        var actions = el('div', 'album-actions');
        var cropBtn2 = el('button', 'pbtn'); cropBtn2.type = 'button'; cropBtn2.textContent = '裁剪';
        cropBtn2.addEventListener('click', function () {
          openCropper({
            src: imgData.src, aspect: NaN, title: '裁剪相册图片', maxSize: 1400,
            onConfirm: function (cropped) {
              imgData.src = cropped; save(); render();
              reopenPanel(c.id);
            }
          });
        });
        actions.appendChild(cropBtn2);

        if (idx !== c.coverIndex) {
          var setBtn = el('button', 'pbtn'); setBtn.type = 'button'; setBtn.textContent = '设为封面';
          setBtn.addEventListener('click', function () {
            c.coverIndex = idx; save(); render();
            reopenPanel(c.id);
          });
          actions.appendChild(setBtn);
        }

        var delImgBtn = el('button', 'pbtn danger'); delImgBtn.type = 'button'; delImgBtn.textContent = '删除';
        delImgBtn.addEventListener('click', function () {
          c.images.splice(idx, 1);
          if (idx < c.coverIndex) c.coverIndex--;
          if (c.coverIndex >= c.images.length) c.coverIndex = Math.max(0, c.images.length - 1);
          save(); render();
          reopenPanel(c.id);
        });
        actions.appendChild(delImgBtn);
        item.appendChild(actions);
        panel.appendChild(item);
      });
    }

    if (c.type === 'qa') {
      var addQ = el('button', 'padd'); addQ.type = 'button'; addQ.textContent = '+ 添加一组问答';
      addQ.addEventListener('click', function () {
        c.pairs.push({ q:'问题', a:'回答' });
        save(); render();
        reopenPanel(c.id);
      });
      panel.appendChild(addQ);
    }

    return panel;
  }

  function segControl(items, current, onChange) {
    var seg = el('div', 'seg');
    items.forEach(function (item) {
      var b = el('button'); b.type = 'button'; b.textContent = item[1];
      if (item[0] === current) b.classList.add('on');
      b.addEventListener('click', function () {
        seg.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); onChange(item[0]);
      });
      seg.appendChild(b);
    });
    return seg;
  }

  function colorRow(label, value, onChange) {
    var row = el('div', 'prow');
    var lb = el('span', 'plabel'); lb.textContent = label; row.appendChild(lb);
    var inp = el('input'); inp.type = 'color'; inp.value = value || '#ffffff';
    inp.addEventListener('input', function () { onChange(inp.value); });
    row.appendChild(inp);
    var reset = el('button', 'pbtn'); reset.type = 'button'; reset.textContent = '默认';
    reset.addEventListener('click', function () { inp.value = '#ffffff'; onChange('#ffffff'); });
    row.appendChild(reset);
    return row;
  }

  function tagColorRow(current, onChange) {
    var row = el('div', 'prow');
    var lb = el('span', 'plabel'); lb.textContent = '标签颜色';
    row.appendChild(lb);
    var colors = ['blue','green','pink','yellow','purple','gray'];
    var dots = el('div', 'color-dots');
    colors.forEach(function (c) {
      var btn = el('button', 'color-dot color-' + c);
      btn.type = 'button';
      if (c === current) btn.classList.add('active');
      btn.addEventListener('click', function () {
        dots.querySelectorAll('.color-dot').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        onChange(c);
      });
      dots.appendChild(btn);
    });
    row.appendChild(dots);
    return row;
  }

  function reopenPanel(cardId) {
    requestAnimationFrame(function () {
      var nc = grid.querySelector('[data-id="' + cardId + '"]');
      if (nc) { var p = nc.querySelector('.card-panel'); if (p) p.classList.add('show'); }
    });
  }

  function checkOverflows() {
    if (document.body.classList.contains('edit')) return;
    document.querySelectorAll('.card[data-type="note"]').forEach(function (card) {
      var body = card.querySelector('.card-body');
      var btn = card.querySelector('.note-more');
      if (!body || !btn) return;
      btn.hidden = body.scrollHeight <= body.clientHeight + 2;
    });
  }

  $('#exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'creation-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出 JSON');
  });
  $('#importBtn').addEventListener('click', function () { importFile.click(); });
  importFile.addEventListener('change', function () {
    var f = importFile.files && importFile.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || !Array.isArray(d.cards)) throw new Error('bad');
        state = normalize(d);
        editingCardId = null;
        save(); render(); syncAppearanceUI();
        applyAudioVolume();
        if (state.currentTrackId) {
          var t = state.playlist.find(function (x) { return x.id === state.currentTrackId; });
          if (t && t.audioUrl) { audio.src = t.audioUrl; audio.removeAttribute('crossorigin'); audio.load(); }
        }
        toast('导入成功');
      } catch (err) { toast('导入失败'); }
    };
    reader.readAsText(f);
    importFile.value = '';
  });

  $('#modalClose').addEventListener('click', closeModal);
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) closeModal(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (cropperMask.classList.contains('show')) { closeCropper(); return; }
      if (lightboxMask.classList.contains('show')) { closeLightbox(); return; }
      if (addModalMask.classList.contains('show')) { closeAddModal(); return; }
      if (modalMask.classList.contains('show')) { closeModal(); return; }
      appearancePop.classList.remove('show');
      hideRte();
    }
    if (lightboxMask.classList.contains('show')) {
      if (e.key === 'ArrowLeft') lbGo(-1);
      else if (e.key === 'ArrowRight') lbGo(1);
    }
  });

  /* ============ 启动 ============ */
  renderAddOptions();
  render();
  syncAppearanceUI();
  updateClock();
  applyAudioVolume();

  if (state.currentTrackId) {
    var t = state.playlist.find(function (x) { return x.id === state.currentTrackId; });
    if (t && t.audioUrl) {
      audio.src = t.audioUrl;
      audio.removeAttribute('crossorigin');
      audio.load();
    }
  }
})();
</script>
</body>
</html>
