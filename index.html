<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>creation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
<style>
  :root{
    --bg:#f6f7f9; --text:#1f2328; --line:#ececef; --accent:#2f6fed;
    --fs-base:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
    --clock-font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --music-theme-color: #2f6fed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background-color:#f6f7f9;
    background-size:cover;background-position:center;
    background-attachment:fixed;background-repeat:no-repeat;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:var(--fs-base);line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  }
  button{font-family:inherit}
  [hidden]{display:none !important}

  .bg-mask{
    position:fixed;inset:0;z-index:0;
    background:rgba(255,255,255, var(--bg-mask-alpha, 0.5));
    pointer-events:none;display:none;
  }
  body.has-bg-image .bg-mask{display:block}

  .nav{
    position:sticky;top:0;z-index:80;height:56px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
    background:rgba(246,247,249,.85);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid rgba(0,0,0,.045);
  }
  .brand{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .nav-actions{display:flex;align-items:center;gap:4px}
  .icon-btn{
    width:34px;height:34px;border:none;border-radius:10px;background:transparent;
    display:grid;place-items:center;color:#6b7076;cursor:pointer;transition:.16s;
  }
  .icon-btn:hover{background:#e9eaee;color:var(--text)}
  .edit-btn{
    margin-left:6px;border:1px solid #e3e6ea;background:#fff;border-radius:999px;
    padding:6px 14px;font-size:13px;font-weight:600;color:#40454b;
    cursor:pointer;transition:.18s;
  }
  .edit-btn:hover{border-color:#d3d8df}
  .edit-btn.on{background:#1f2328;color:#fff;border-color:#1f2328}

  .clock-widget{
    position:fixed;left:24px;top:120px;z-index:40;
    display:none;flex-direction:column;gap:8px;
    padding:18px 20px;border-radius:20px;
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 8px 32px rgba(16,24,40,.06);
    pointer-events:none;user-select:none;
  }
  @media (min-width:1200px){ .clock-widget{display:flex} }
  .clock-time{
    font-size:36px;font-weight:800;letter-spacing:-.03em;
    line-height:1;color:var(--text);
    font-variant-numeric:tabular-nums;
    font-family:var(--clock-font);
  }
  .clock-greeting{
    font-size:13.5px;color:#8a919a;font-weight:500;
    max-width:180px;line-height:1.5;word-break:break-word;
  }

  .appearance-pop{
    position:absolute;top:calc(100% - 4px);right:16px;
    width:320px;background:#fff;border:1px solid var(--line);
    border-radius:16px;box-shadow:0 16px 48px rgba(16,24,40,.14);
    padding:16px;display:none;z-index:90;max-height:82vh;overflow-y:auto;
  }
  .appearance-pop.show{display:block}
  .ap-title{font-size:11px;font-weight:700;color:#9aa2ad;letter-spacing:.06em;margin:0 0 12px}
  .ap-sub{font-size:10.5px;font-weight:700;color:#9aa2ad;letter-spacing:.06em;margin:14px 0 6px;padding-top:10px;border-top:1px dashed var(--line)}
  .ap-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:10px}
  .ap-label{font-size:13px;color:#5b6169;flex:none}
  .ap-input{
    flex:1;min-width:0;padding:6px 10px;
    border:1px solid var(--line);border-radius:8px;
    font-size:12px;font-family:inherit;outline:none;
    background:#fff;color:var(--text);
  }
  .ap-input:focus{border-color:#b9cdf7}
  select.ap-input{cursor:pointer}
  input[type=color]{
    -webkit-appearance:none;appearance:none;
    width:34px;height:27px;border:1px solid var(--line);border-radius:8px;
    padding:0;background:none;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
    background:#e3e6ea;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;
    border-radius:50%;background:#1f2328;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#1f2328;
    cursor:pointer;border:none;
  }

  .seg{display:inline-flex;background:#f1f2f4;border-radius:9px;padding:2px;gap:2px}
  .seg button{
    border:none;background:transparent;border-radius:7px;
    padding:4px 10px;font-size:11.5px;font-weight:600;color:#727880;
    cursor:pointer;transition:.15s;
  }
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.09)}

  .wrap{max-width:960px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1}

  .hero{
    position:relative;margin-top:18px;min-height:240px;border-radius:20px;overflow:hidden;
    background:linear-gradient(135deg,#eef2ff 0%,#f7edff 48%,#e9f9f2 100%);
    background-size:cover;background-position:center;
    display:flex;align-items:flex-end;
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .hero::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.52));
    opacity:0;transition:opacity .25s;
  }
  .hero.has-cover::before{opacity:1}
  .hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:22px;width:100%}
  .hero.has-cover .hero-inner{color:#fff}
  .avatar{
    width:60px;height:60px;flex:none;border-radius:50%;background:#fff;
    display:grid;place-items:center;overflow:hidden;color:#c3c8cf;
    box-shadow:0 2px 12px rgba(0,0,0,.14);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  body.edit .avatar{cursor:pointer;outline:2px dashed rgba(140,140,150,.55);outline-offset:3px}
  .hero-txt{min-width:0}
  .hero-txt h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25;word-break:break-word}
  .hero-txt p{margin:5px 0 0;font-size:13.5px;line-height:1.5;opacity:.82;word-break:break-word;white-space:pre-wrap}
  body.edit .hero-txt [contenteditable=true]{outline:1px dashed #cfd6e4;outline-offset:3px;border-radius:4px}

  [contenteditable=true]{outline:none}
  body.edit [contenteditable=true]:focus{outline:2px solid #b9cdf7;outline-offset:3px;border-radius:4px}
  [contenteditable=true]:empty::before{content:attr(data-ph);color:#b8bec7;pointer-events:none}

  .addbar{display:none;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  body.edit .addbar{display:flex}
  .addbar button{
    padding:10px 20px;border-radius:12px;border:none;
    background:#1f2328;color:#fff;font-size:13px;font-weight:600;
    cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .addbar button:hover{background:#000}
  .addbar button svg{width:14px;height:14px}

  .grid{
    margin-top:16px;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:14px;align-items:start;
  }
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3, minmax(0, 1fr))} }
  @media (min-width:900px){ .grid{grid-template-columns:repeat(4, minmax(0, 1fr))} }

  .card{
    --card-bg:#ffffff;
    position:relative;display:flex;flex-direction:column;
    background:var(--card-bg);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;min-width:0;max-width:100%;
    transition:box-shadow .2s,opacity .2s;
  }
  .card.size-1x1{grid-column:span 1;aspect-ratio:1 / 1}
  .card.size-2x1{grid-column:span 2;aspect-ratio:2.1 / 1}
  .card:hover{box-shadow:0 6px 24px rgba(16,24,40,.09)}
  .card.dragging{opacity:.4}
  .card.clickable{cursor:pointer}
  body.edit .card{outline:1.5px dashed #dfe3ea;outline-offset:-1px}

  .card-head{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:12px 14px 8px;min-height:42px;
  }
  .card.no-head .card-head{display:none}
  .card.no-head .card-body{padding-top:14px}
  .handle{
    display:none;flex:none;margin-left:-4px;color:#c9ced6;
    cursor:grab;place-items:center;user-select:none;
  }
  .handle svg{pointer-events:none}
  body.edit .handle{display:grid}
  .handle:active{cursor:grabbing}
  .card-title{
    flex:1;min-width:0;margin:0;
    font-size:calc(var(--fs-base) + 1px);font-weight:700;line-height:1.35;
    word-break:break-word;
  }
  .card-tools{display:none;flex:none;align-items:center;gap:2px}
  body.edit .card-tools{display:flex}
  .tool-btn{
    width:26px;height:26px;border:none;border-radius:7px;background:transparent;
    color:#b3b9c1;display:grid;place-items:center;cursor:pointer;transition:.15s;
  }
  .tool-btn:hover{background:#eef0f3;color:#4a5058}
  .tool-btn.danger:hover{background:#ffeceb;color:#e5484d}

  .card.floating-tools .card-head{
    position:absolute;top:6px;right:6px;left:6px;
    padding:0;min-height:0;background:transparent;
    justify-content:flex-end;
    pointer-events:none;z-index:25;
  }
  .card.floating-tools .card-head .card-title{display:none}
  .card.floating-tools .card-head .handle{
    position:absolute;left:0;top:0;
    pointer-events:auto;
    background:rgba(255,255,255,.9);
    border-radius:6px;padding:3px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .card.floating-tools .card-head .card-tools{
    pointer-events:auto;
    background:rgba(255,255,255,.9);
    border-radius:8px;padding:2px;
    box-shadow:0 1px 4px rgba(0,0,0,.1);
  }
  body:not(.edit) .card.floating-tools .card-head{display:none}
  .card.floating-tools .card-body{padding:10px}

  .card-body{
    flex:1;min-height:0;min-width:0;overflow-y:auto;
    padding:0 14px 14px;position:relative;
  }
  .card-body.no-scroll{overflow:hidden;padding:0}
  .card-body.fill{
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .card-body.fill > *{flex:1;min-height:0;min-width:0}
  .card-text{
    font-size:var(--fs-base);line-height:1.7;color:inherit;
    word-break:break-word;overflow-wrap:anywhere;
  }

  .img-fill{position:absolute;inset:0;background:#f2f3f5}
  .img-fill img{
    width:100%;height:100%;
    object-fit:cover;object-position:center center;
    display:block;
  }
  .img-empty{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:#a8aeb7;font-size:12px;text-align:center;padding:8px;
  }
  .img-upload-btn{
    position:absolute;right:10px;bottom:10px;z-index:4;
    background:rgba(20,22,26,.68);color:#fff;font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:8px;cursor:pointer;border:none;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:.15s;
  }
  .img-upload-btn:hover{background:rgba(20,22,26,.86)}

  .album-badge{
    position:absolute;top:10px;right:10px;z-index:3;
    background:rgba(20,22,26,.62);color:#fff;
    font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;
    display:flex;align-items:center;gap:4px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .album-badge svg{width:12px;height:12px}
  .album-hint{
    position:absolute;left:10px;bottom:10px;z-index:3;
    background:rgba(255,255,255,.92);color:#4a5058;
    font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
  }

  .fade-bottom{
    position:absolute;left:0;right:0;bottom:0;height:48px;
    background:linear-gradient(to bottom,rgba(255,255,255,0),var(--card-bg));
    pointer-events:none;z-index:2;
  }

  .note-more{
    position:absolute;right:10px;bottom:10px;z-index:3;
    border:none;background:rgba(20,22,26,.06);color:var(--accent);
    font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;
    cursor:pointer;transition:.15s;
  }
  .note-more:hover{background:rgba(47,111,237,.12)}

  .qa-thread{display:flex;flex-direction:column;gap:7px}
  .qa-bubble{
    max-width:86%;padding:8px 12px;border-radius:13px;
    font-size:calc(var(--fs-base) - .5px);line-height:1.6;
    word-break:break-word;overflow-wrap:anywhere;
  }
  .qa-bubble.q{
    background:#f1f3f6;color:#3a4048;
    align-self:flex-start;border-bottom-left-radius:5px;
  }
  .qa-bubble.a{
    background:#eaf1ff;color:#26467f;
    align-self:flex-end;border-bottom-right-radius:5px;
  }
  .qa-empty{margin:0;font-size:13px;color:#a8aeb7}
  .qa-pair{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 0}
  body.edit .qa-pair{padding:10px 10px 12px;border-radius:12px;background:#f7f8fa;margin-bottom:8px}
  .qa-rm{
    position:absolute;top:4px;right:4px;width:20px;height:20px;
    border:none;border-radius:6px;
    background:rgba(255,255,255,.9);color:#c0c6ce;cursor:pointer;
    display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .qa-rm:hover{background:#ffeceb;color:#e5484d}

  .card-panel{
    position:absolute;inset:0;z-index:30;
    background:#fff;overflow-y:auto;padding:14px;
    display:none;
  }
  .card-panel.show{display:block}
  body:not(.edit) .card-panel{display:none !important}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .panel-head strong{font-size:13px}
  .panel-close{
    border:none;background:#f1f2f4;border-radius:8px;width:26px;height:26px;
    display:grid;place-items:center;cursor:pointer;color:#6b7076;
  }
  .panel-close:hover{background:#e9eaee}
  .prow{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
  .plabel{font-size:12px;color:#8a919a;width:60px;flex:none}
  .pbtn{
    border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:4px 10px;font-size:11.5px;font-weight:600;color:#4a5058;cursor:pointer;
    transition:.15s;
  }
  .pbtn:hover{background:#f1f2f4}
  .pbtn.primary{background:#1f2328;color:#fff;border-color:#1f2328}
  .pbtn.primary:hover{background:#000}
  .pbtn.danger{color:#d8484d;border-color:#f1d8d9}
  .pbtn.danger:hover{background:#ffeceb}
  .pinput{
    flex:1;min-width:0;padding:6px 10px;
    border:1px solid var(--line);border-radius:8px;
    font-size:12px;font-family:inherit;outline:none;background:#fff;color:var(--text);
  }
  .pinput:focus{border-color:#b9cdf7}
  .padd{
    width:100%;margin-top:8px;border:1px dashed #d8dde4;background:#fff;
    border-radius:10px;padding:8px;font-size:12px;font-weight:600;color:#727880;
    cursor:pointer;transition:.15s;
  }
  .padd:hover{border-color:#b9cdf7;color:var(--accent);background:#f7faff}

  .album-edit-item{
    margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);
    display:flex;align-items:center;gap:10px;
  }
  .album-thumb{
    width:52px;height:52px;border-radius:8px;overflow:hidden;
    background:#f2f3f5;position:relative;flex:none;
  }
  .album-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-badge{
    position:absolute;top:2px;left:2px;
    background:var(--accent);color:#fff;font-size:9px;
    padding:1px 5px;border-radius:4px;font-weight:700;
  }
  .album-actions{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}

  .relation-card{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;height:100%;width:100%;min-height:0;
    padding:4px 8px;
  }
  .relation-side{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    gap:8px;min-width:0;
  }
  .relation-avatar{
    width:64px;height:64px;border-radius:50%;
    background:#f2f3f5;overflow:hidden;
    display:grid;place-items:center;color:#c3c8cf;flex:none;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .relation-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  body.edit .relation-avatar{cursor:pointer;outline:2px dashed rgba(140,140,150,.5);outline-offset:3px}
  .relation-name{
    font-size:12.5px;font-weight:600;text-align:center;
    max-width:90px;word-break:break-word;line-height:1.3;
  }
  .relation-middle{
    flex:1;min-width:0;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 4px;gap:0;
  }
  .relation-top-text,
  .relation-bottom-text{
    font-size:11px;font-weight:600;color:#8a919a;
    padding:2px 10px;border-radius:8px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(0,0,0,.05);
    white-space:nowrap;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;
    text-align:center;position:relative;z-index:1;
  }
  .relation-arrows{
    width:100%;height:38px;display:block;flex-shrink:0;
    margin:-4px 0;
  }
  @media (max-width:480px){
    .relation-avatar{width:52px;height:52px}
    .relation-name{font-size:11.5px;max-width:70px}
    .relation-card{gap:6px;padding:4px}
    .relation-arrows{height:32px}
    .relation-top-text,.relation-bottom-text{font-size:10.5px;padding:2px 8px}
  }

  .profile-card{
    display:flex;height:100%;min-height:0;width:100%;
    gap:12px;
  }
  .profile-card.layout-h{flex-direction:row;align-items:stretch}
  .profile-card.layout-v{flex-direction:column}
  .profile-img{
    background:#f2f3f5;border-radius:10px;overflow:hidden;
    position:relative;flex:0 0 auto;min-width:0;
  }
  .profile-card.layout-h .profile-img{flex:0 0 40%;max-width:40%;height:100%}
  .profile-card.layout-v .profile-img{flex:1;width:100%;min-height:0}
  .profile-img img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  body.edit .profile-img{cursor:pointer}
  .profile-meta{
    flex:1;min-width:0;min-height:0;
    display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;
  }
  .profile-card.layout-v .profile-meta{
    flex:0 0 auto;max-height:50%;
    overflow-y:auto;padding-top:2px;
  }
  .profile-desc{
    font-size:calc(var(--fs-base) - 0.5px);
    line-height:1.65;color:#4a5058;
    overflow-wrap:anywhere;word-break:break-word;
  }

  .quote-card{
    position:relative;height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:14px 18px;
    background:var(--quote-bg, #f7f5ff);
    border-radius:12px;
    overflow:hidden;
  }
  .quote-icon{
    position:absolute;top:6px;left:12px;
    color:rgba(99,64,168,.18);
    pointer-events:none;
  }
  .quote-text{
    font-size:calc(var(--fs-base) + 1px);
    font-style:italic;line-height:1.75;
    color:#3a4048;
    word-break:break-word;overflow-wrap:anywhere;
    overflow-y:auto;max-height:100%;
    padding-left:2px;
  }

  .tags-wrap{
    display:flex;flex-wrap:wrap;gap:6px;
    align-content:flex-start;
    height:100%;overflow-y:auto;
    padding:2px 0;
  }
  .tag-chip{
    display:inline-block;
    padding:4px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    line-height:1.45;
    white-space:nowrap;
  }
  .tag-blue{background:#eaf1ff;color:#26467f}

  var modalMask = $('#modalMask'), modalTitle = $('#modalTitle'), modalBody = $('#modalBody');
  var lightboxMask = $('#lightboxMask'), lightboxImg = $('#lightboxImg'),
      lightboxCounter = $('#lightboxCounter'), lightboxPrev = $('#lightboxPrev'), lightboxNext = $('#lightboxNext');
  var cropperMask = $('#cropperMask'), cropperTitle = $('#cropperTitle'),
      cropperImg = $('#cropperImg'), cropperConfirm = $('#cropperConfirm'), cropperCancel = $('#cropperCancel');
  var addModalMask = $('#addModalMask'), addModalGrid = $('#addModalGrid');
  var clockTime = $('#clockTime'), clockGreeting = $('#clockGreeting');
  var stickerLayer = $('#stickerLayer');

  var FS_MAP = { sm:'13px', md:'14px', lg:'16px' };
  var FONT_MAP = {
    sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif',
    serif: 'Georgia, "Times New Roman", "Songti SC", serif',
    mono: '"SF Mono", Menlo, Consolas, "Courier New", monospace',
    hand: '"Comic Sans MS", "Segoe Script", "Bradley Hand", "Kaiti SC", cursive'
  };

  function applyTheme() {
    document.documentElement.style.setProperty('--fs-base', FS_MAP[state.theme.fontSize] || '14px');
    document.documentElement.style.setProperty('--text', state.theme.textColor || '#1f2328');
    document.documentElement.style.setProperty('--clock-font', FONT_MAP[state.clockFont] || FONT_MAP.sans);
  }
  function applyBackground() {
    var t = state.theme;
    document.body.style.backgroundColor = t.bgColor || '#f6f7f9';
    document.body.style.backgroundImage = t.bgImage ? 'url("' + t.bgImage + '")' : '';
    document.body.style.setProperty('--bg-mask-alpha', String(t.bgMask != null ? t.bgMask : 0.5));
    document.body.classList.toggle('has-bg-image', !!t.bgImage);
  }

  function syncAppearanceUI() {
    appearancePop.querySelectorAll('[data-fs]').forEach(function (b) { b.classList.toggle('on', b.dataset.fs === state.theme.fontSize); });
    themeTextColor.value = state.theme.textColor || '#1f2328';
    themeBgColor.value = state.theme.bgColor || '#f6f7f9';
    bgMaskRange.value = Math.round((state.theme.bgMask != null ? state.theme.bgMask : 0.5) * 100);
    var gi = $('#greetingInput');
    if (gi) gi.value = state.greeting || '';
    var cf = $('#clockFontSelect');
    if (cf) cf.value = state.clockFont || 'sans';
  }

  function findCard(id) {
    for (var i = 0; i < state.cards.length; i++) if (state.cards[i].id === id) return state.cards[i];
    return null;
  }

  function updateClock() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    clockTime.textContent = hh + ':' + mm;
    clockGreeting.textContent = state.greeting || '';
  }
  setInterval(updateClock, 1000);

  /* ============ 主渲染 ============ */
  function render() {
    applyTheme(); applyBackground();
    document.body.classList.toggle('edit', editMode);
    editBtn.textContent = editMode ? '完成' : '编辑模式';
    editBtn.classList.toggle('on', editMode);

    var p = state.profile || {};
    hero.classList.toggle('has-cover', !!p.cover);
    hero.style.backgroundImage = p.cover ? 'url("' + p.cover + '")' : '';

    nameEl.innerHTML = p.name || '';
    bioEl.innerHTML = p.bio || '';
    nameEl.contentEditable = editMode ? 'true' : 'false';
    bioEl.contentEditable = editMode ? 'true' : 'false';

    if (p.avatar) {
      avatarBox.innerHTML = '';
      var im = el('img'); im.src = p.avatar; im.alt = '';
      avatarBox.appendChild(im);
    } else { avatarBox.innerHTML = ICON.user; }

    grid.innerHTML = '';
    state.cards.forEach(function (c) {
      try {
        grid.appendChild(buildCard(c));
      } catch (err) {
        console.error('card render error:', c.type, err);
      }
    });

    renderStickers();
    try { updateMusicUI(); } catch (e) { /* ignore */ }
  }

  function buildCard(c) {
    var useSize = (c.type === 'relation') ? '2x1' : (c.size || '1x1');
    var card = el('article', 'card size-' + useSize);
    card.dataset.id = c.id;
    card.dataset.type = c.type;
    card.style.setProperty('--card-bg', c.bg || '#ffffff');
    /* 关键：音乐主题色挂在 card 上，供 .mp-btn.main / .mp-progress-fill / .mp-vol-slider 共享 */
    if (c.type === 'music') {
      card.style.setProperty('--music-theme-color', c.playColor || '#2f6fed');
    }

    var isFloating = (c.type === 'relation' || c.type === 'music');
    if (isFloating) card.classList.add('floating-tools');

    var hasTitle = stripTags(c.title) !== '';
    var hasHeadBg = c.headBg && c.headBg !== '#ffffff';
    var forceNoHeadOnDisplay = ['quote'].indexOf(c.type) >= 0;

    if (!isFloating) {
      if (forceNoHeadOnDisplay && !editMode) card.classList.add('no-head');
      else if (!forceNoHeadOnDisplay && !editMode && !hasTitle && !hasHeadBg) card.classList.add('no-head');
    }

    var head = el('div', 'card-head');
    if (hasHeadBg) head.style.background = c.headBg;

    var handle = el('span', 'handle');
    handle.draggable = true; handle.title = '拖拽排序'; handle.innerHTML = ICON.grip;

    var title = el('h3', 'card-title');
    title.dataset.field = 'title'; title.dataset.ph = '标题（可选）';
    title.contentEditable = editMode ? 'true' : 'false';
    title.innerHTML = c.title || '';

    var tools = el('div', 'card-tools');
    var settingsBtn = el('button', 'tool-btn'); settingsBtn.type = 'button'; settingsBtn.title = '设置'; settingsBtn.innerHTML = ICON.sliders;
    var delBtn = el('button', 'tool-btn danger'); delBtn.type = 'button'; delBtn.title = '删除卡片'; delBtn.innerHTML = ICON.trash;
    tools.appendChild(settingsBtn); tools.appendChild(delBtn);

    head.appendChild(handle); head.appendChild(title); head.appendChild(tools);

    var body = buildBody(c);
    var panel = buildPanel(c, card, head);

    card.appendChild(head); card.appendChild(body); card.appendChild(panel);

    settingsBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (panel.classList.contains('show')) { panel.classList.remove('show'); editingCardId = null; }
      else { panel.classList.add('show'); editingCardId = c.id; }
    });

    if (!editMode) {
      if (c.type === 'qa') {
        card.classList.add('clickable');
        card.addEventListener('click', function (e) {
          if (e.target.closest('a,button')) return;
          openQAModal(c);
        });
      } else if (c.type === 'album' && c.images.length) {
        card.classList.add('clickable');
        card.addEventListener('click', function (e) {
          if (e.target.closest('a,button')) return;
          openAlbumModal(c);
        });
      }
    }

    return card;
  }

  function buildBody(c) {
    var body = el('div', 'card-body');

    if (c.type === 'image' || c.type === 'album') {
      body.classList.add('no-scroll');
    } else if (['relation','profile','quote','tags','music'].indexOf(c.type) >= 0) {
      body.classList.add('fill');
    }

    if (c.type === 'text') {
      var txt = el('div', 'card-text');
      txt.dataset.field = 'content'; txt.dataset.ph = '写点什么…';
      txt.contentEditable = editMode ? 'true' : 'false';
      txt.innerHTML = c.content || '';
      body.appendChild(txt);
      if (!editMode) body.appendChild(el('div', 'fade-bottom'));
    }
    else if (c.type === 'note') {
      var ntxt = el('div', 'card-text');
      ntxt.dataset.field = 'content'; ntxt.dataset.ph = '写点什么…';
      ntxt.contentEditable = editMode ? 'true' : 'false';
      ntxt.innerHTML = c.content || '';
      body.appendChild(ntxt);
      if (!editMode) {
        body.appendChild(el('div', 'fade-bottom'));
        var more = el('button', 'note-more');
        more.type = 'button'; more.textContent = '查看全文'; more.hidden = true;
        more.addEventListener('click', function (e) { e.stopPropagation(); openNoteModal(c); });
        body.appendChild(more);
      }
    }
    else if (c.type === 'image') {
      var fill = el('div', 'img-fill');
      if (c.img) {
        var im = el('img'); im.src = c.img; im.alt = '';
        fill.appendChild(im);
      } else {
        var empty = el('div', 'img-empty');
        empty.innerHTML = ICON.image + '<span>还没有图片</span>';
        fill.appendChild(empty);
      }
      body.appendChild(fill);

      if (editMode) {
        var fileInput = el('input');
        fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
        var upBtn = el('button', 'img-upload-btn');
        upBtn.type = 'button'; upBtn.textContent = c.img ? '更换图片' : '上传图片';
        upBtn.addEventListener('click', function (e) { e.stopPropagation(); fileInput.click(); });
        fileInput.addEventListener('change', function () {
          var f = fileInput.files && fileInput.files[0];
          if (!f) return;
          readImageFile(f, 1600, function (dataUrl) {
            openCropper({
              src: dataUrl, aspect: NaN, title: '裁剪图片', maxSize: 1400,
              onConfirm: function (cropped) {
                c.img = cropped; save();
                var wrap = grid.querySelector('[data-id="' + c.id + '"] .img-fill');
                if (wrap) {
                  wrap.innerHTML = '';
                  var newImg = document.createElement('img');
                  newImg.src = cropped; newImg.alt = '';
                  wrap.appendChild(newImg);
                } else { render(); }
                toast('图片已保存');
              }
            });
          });
        });
        body.appendChild(fileInput);
        body.appendChild(upBtn);
      }
    }
    else if (c.type === 'album') {
      var fillA = el('div', 'img-fill');
      if (c.images.length) {
        var idx = Math.min(Math.max(0, c.coverIndex || 0), c.images.length - 1);
        var coverIm = el('img'); coverIm.src = c.images[idx].src; coverIm.alt = '';
        fillA.appendChild(coverIm);
      } else {
        var emptyA = el('div', 'img-empty');
        emptyA.innerHTML = ICON.image + '<span>还没有图片</span>';
        fillA.appendChild(emptyA);
      }
      body.appendChild(fillA);

      if (!editMode && c.images.length) {
        var badge = el('div', 'album-badge');
        badge.innerHTML = ICON.stack + '<span>' + c.images.length + '</span>';
        body.appendChild(badge);
      }
      if (editMode) {
        var hint = el('div', 'album-hint');
        hint.textContent = '共 ' + c.images.length + ' 张 · 点设置管理';
        body.appendChild(hint);
      }
    }
    else if (c.type === 'qa') {
      if (editMode) body.appendChild(buildQAEditor(c));
      else body.appendChild(buildQAPreview(c));
    }
    else if (c.type === 'relation') {
      body.appendChild(buildRelation(c));
    }
    else if (c.type === 'profile') {
      body.appendChild(buildProfile(c));
    }
    else if (c.type === 'quote') {
      body.appendChild(buildQuote(c));
    }
    else if (c.type === 'tags') {
      body.appendChild(buildTags(c));
    }
    else if (c.type === 'music') {
      body.appendChild(buildMusicPlayer(c));
    }

    return body;
  }

  function buildRelation(c) {
    var wrap = el('div', 'relation-card');
    wrap.appendChild(buildRelationSide(c, 'left'));
    wrap.appendChild(buildRelationMiddle(c));
    wrap.appendChild(buildRelationSide(c, 'right'));
    return wrap;
  }

  function buildRelationSide(c, side) {
    var box = el('div', 'relation-side');
    var avatar = el('div', 'relation-avatar');
    var avSrc = side === 'left' ? c.leftAvatar : c.rightAvatar;
    if (avSrc) {
      var im = el('img'); im.src = avSrc; im.alt = '';
      avatar.appendChild(im);
    } else {
      avatar.innerHTML = ICON.user;
    }
    box.appendChild(avatar);

    var name = el('div', 'relation-name');
    name.dataset.field = side === 'left' ? 'leftName' : 'rightName';
    name.dataset.ph = side === 'left' ? '我' : 'TA';
    name.contentEditable = editMode ? 'true' : 'false';
    name.textContent = (side === 'left' ? c.leftName : c.rightName) || '';
    box.appendChild(name);

    if (editMode) {
      avatar.style.cursor = 'pointer';
      avatar.addEventListener('click', function (e) {
        e.stopPropagation();
        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          readImageFile(f, 800, function (url) {
            openCropper({
              src: url, aspect: 1, title: '裁剪头像', maxSize: 500,
              onConfirm: function (cropped) {
                if (side === 'left') c.leftAvatar = cropped;
                else c.rightAvatar = cropped;
                save(); render();
                toast('头像已保存');
              }
            });
          });
        });
        inp.click();
      });
    }

    return box;
  }

  function buildRelationMiddle(c) {
    var mid = el('div', 'relation-middle');

    var topText = el('div', 'relation-top-text');
    topText.dataset.field = 'topText';
    topText.dataset.ph = '暗恋';
    topText.contentEditable = editMode ? 'true' : 'false';
    topText.textContent = c.topText || '';
    mid.appendChild(topText);

    var suffix = String(c.id || 'x').replace(/[^a-zA-Z0-9]/g, '');
    var markerR = 'arrR_' + suffix;
    var markerL = 'arrL_' + suffix;

    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 120 40');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('class', 'relation-arrows');
    svg.innerHTML =
      '<defs>' +
        '<marker id="' + markerR + '" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L5,2.5 L0,5 Z" fill="#c8cdd4"/></marker>' +
        '<marker id="' + markerL + '" markerWidth="5" markerHeight="5" refX="0.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M5,0 L0,2.5 L5,5 Z" fill="#c8cdd4"/></marker>' +
      '</defs>' +
      '<path d="M 8 12 Q 60 3 108 12" fill="none" stroke="#c8cdd4" stroke-width="1.5" vector-effect="non-scaling-stroke" marker-end="url(#' + markerR + ')"/>' +
      '<path d="M 112 28 Q 60 37 12 28" fill="none" stroke="#c8cdd4" stroke-width="1.5" vector-effect="non-scaling-stroke" marker-end="url(#' + markerL + ')"/>';
    mid.appendChild(svg);

    var bottomText = el('div', 'relation-bottom-text');
    bottomText.dataset.field = 'bottomText';
    bottomText.dataset.ph = '守护';
    bottomText.contentEditable = editMode ? 'true' : 'false';
    bottomText.textContent = c.bottomText || '';
    mid.appendChild(bottomText);

    return mid;
  }

  function buildProfile(c) {
    var wrap = el('div', 'profile-card ' + (c.size === '2x1' ? 'layout-h' : 'layout-v'));

    var imgBox = el('div', 'profile-img');
    if (c.img) {
      var im = el('img'); im.src = c.img; im.alt = '';
      imgBox.appendChild(im);
    } else {
      var empty = el('div', 'img-empty');
      empty.innerHTML = ICON.image + '<span>点击上传</span>';
      imgBox.appendChild(empty);
    }
    wrap.appendChild(imgBox);

    var meta = el('div', 'profile-meta');
    var desc = el('div', 'profile-desc');
    desc.dataset.field = 'content';
    desc.dataset.ph = '简介描述…';
    desc.contentEditable = editMode ? 'true' : 'false';
    desc.innerHTML = c.content || '';
    meta.appendChild(desc);
    wrap.appendChild(meta);

    if (editMode) {
      imgBox.addEventListener('click', function (e) {
        e.stopPropagation();
        var inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*';
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          readImageFile(f, 1400, function (url) {
            openCropper({
              src: url, aspect: NaN, title: '裁剪档案图片', maxSize: 1400,
              onConfirm: function (cropped) {
                c.img = cropped; save();
                var box = grid.querySelector('[data-id="' + c.id + '"] .profile-img');
                if (box) {
                  box.innerHTML = '';
                  var im2 = document.createElement('img');
                  im2.src = cropped; im2.alt = '';
                  box.appendChild(im2);
                } else { render(); }
                toast('图片已保存');
              }
            });
          });
        });
        inp.click();
      });
    }
    return wrap;
  }

  function buildQuote(c) {
    var wrap = el('div', 'quote-card');
    wrap.style.setProperty('--quote-bg', c.quoteBg || '#f7f5ff');

    var icon = el('div', 'quote-icon');
    icon.innerHTML = '<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M10 8c-3 0-5 2-5 5v4h5v-5H7c0-2 1-3 3-3V8zM19 8c-3 0-5 2-5 5v4h5v-5h-3c0-2 1-3 3-3V8z"/></svg>';
    wrap.appendChild(icon);

    var txt = el('div', 'quote-text');
    txt.dataset.field = 'content';
    txt.dataset.ph = '写一句喜欢的话…';
    txt.contentEditable = editMode ? 'true' : 'false';
    txt.innerHTML = c.content || '';
    wrap.appendChild(txt);
    return wrap;
  }

  function buildTags(c) {
    var wrap = el('div', 'tags-wrap');
    var tags = (c.tags || '').split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
    var color = c.tagColor || 'blue';

    if (!tags.length) {
      var empty = el('p', 'qa-empty');
      empty.textContent = editMode ? '编辑面板中输入标签，用逗号分隔' : '暂无标签';
      wrap.appendChild(empty);
      return wrap;
    }
    tags.forEach(function (tag) {
      var chip = el('span', 'tag-chip tag-' + color);
      chip.textContent = tag;
      wrap.appendChild(chip);
    });
    return wrap;
  }

  /* ============ 音量控件 ============ */
  function buildVolumeControl() {
    var wrap = el('div', 'mp-volume');

    var btn = el('button', 'mp-vol-btn');
    btn.type = 'button';
    btn.title = '静音/取消静音';
    var isMuted = state.muted || state.volume === 0;
    btn.innerHTML = isMuted ? ICON.volumeOff : ICON.volumeOn;

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      e.preventDefault();
      audio.muted = !audio.muted;
      state.muted = audio.muted;
      save();
      updateMusicUI();
    });

    var slider = el('input');
    slider.type = 'range';
    slider.className = 'mp-vol-slider';
    slider.min = '0';
    slider.max = '1';
    slider.step = '0.05';
    slider.value = String(state.muted ? 0 : state.volume);
    slider.title = '音量';

    /* 初始化填充背景 */
    updateVolumeSliderFill(slider);

    function onSliderInput(e) {
      e.stopPropagation();
      var v = parseFloat(slider.value);
      if (isNaN(v)) v = 0;
      v = Math.max(0, Math.min(1, v));
      audio.volume = v;
      audio.muted = false;
      state.volume = v;
      state.muted = false;
      save();
      updateVolumeSliderFill(slider);
      var card = slider.closest('.card');
      if (card) {
        card.querySelectorAll('.mp-vol-slider').forEach(function (s) {
          if (s !== slider) { s.value = String(v); updateVolumeSliderFill(s); }
        });
        var iconSrc = v === 0 ? ICON.volumeOff : ICON.volumeOn;
        card.querySelectorAll('.mp-vol-btn').forEach(function (b) { b.innerHTML = iconSrc; });
      }
    }
    slider.addEventListener('input', onSliderInput);
    slider.addEventListener('change', onSliderInput);
    ['click','pointerdown','mousedown','touchstart'].forEach(function (ev) {
      slider.addEventListener(ev, function (e) { e.stopPropagation(); }, { passive: true });
    });

    wrap.appendChild(btn);
    wrap.appendChild(slider);
    return wrap;
  }

  /* ============ 音乐卡 ============ */
  function buildMusicPlayer(c) {
    var wrap = el('div', 'music-player');
    wrap.dataset.musicId = c.id;

    var hasPlaylist = state.playlist && state.playlist.length > 0;

    if (!hasPlaylist) {
      var emptyState = el('div', 'mp-empty-state');
      emptyState.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="17" r="3"/><path d="M12 17V6l9-3v11"/><circle cx="18" cy="14" r="3"/></svg>' +
        '<div>曲库为空</div>' +
        '<button class="mp-manage-btn" type="button">管理曲库</button>';
      wrap.appendChild(emptyState);
      emptyState.querySelector('.mp-manage-btn').addEventListener('click', function (e) {
        e.stopPropagation();
        openManagePlaylistModal();
      });
      return wrap;
    }

    var coverWrap = el('div', 'mp-cover');
    var coverImg = el('img'); coverImg.alt = ''; coverImg.style.display = 'none';
    coverWrap.appendChild(coverImg);
    var vinyl = el('div', 'mp-vinyl');
    vinyl.innerHTML = ICON.vinyl;
    coverWrap.appendChild(vinyl);
    wrap.appendChild(coverWrap);

    var body = el('div', 'mp-body');

    var titleLine = el('div', 'mp-title-line');
    var titleEl = el('span', 'mp-title');
    var artistEl = el('span', 'mp-artist');
    titleLine.appendChild(titleEl);
    titleLine.appendChild(artistEl);
    body.appendChild(titleLine);

    var lyricsEl = el('div', 'mp-lyrics');
    body.appendChild(lyricsEl);

    var errEl = el('div', 'mp-error');
    body.appendChild(errEl);

    var progress = el('div', 'mp-progress');
    var curTime = el('span', 'mp-time mp-time-cur'); curTime.textContent = '0:00';
    var bar = el('div', 'mp-progress-bar');
    var fill = el('div', 'mp-progress-fill');
    bar.appendChild(fill);
    var durTime = el('span', 'mp-time mp-time-dur'); durTime.textContent = '0:00';
    progress.appendChild(curTime);
    progress.appendChild(bar);
    progress.appendChild(durTime);
    progress.appendChild(buildVolumeControl());
    body.appendChild(progress);

    var controls = el('div', 'mp-controls');
    var prevBtn = el('button', 'mp-btn'); prevBtn.type = 'button'; prevBtn.innerHTML = ICON.prev;
    var playBtn = el('button', 'mp-btn main'); playBtn.type = 'button'; playBtn.innerHTML = ICON.play;
    var nextBtn = el('button', 'mp-btn'); nextBtn.type = 'button'; nextBtn.innerHTML = ICON.next;
    var modeBtn = el('button', 'mp-mode'); modeBtn.type = 'button';
    var volumeControl2 = buildVolumeControl();
    var playlistBtn = el('button', 'mp-playlist-btn');
    playlistBtn.type = 'button';
    playlistBtn.innerHTML = ICON.list + '<span>列表</span>';

    controls.appendChild(prevBtn);
    controls.appendChild(playBtn);
    controls.appendChild(nextBtn);
    controls.appendChild(modeBtn);
    controls.appendChild(volumeControl2);
    controls.appendChild(playlistBtn);
    body.appendChild(controls);
    wrap.appendChild(body);

    playBtn.addEventListener('click', function (e) { e.stopPropagation(); togglePlay(); });
    prevBtn.addEventListener('click', function (e) { e.stopPropagation(); playPrev(); });
    nextBtn.addEventListener('click', function (e) { e.stopPropagation(); playNext(true); });
    modeBtn.addEventListener('click', function (e) { e.stopPropagation(); cyclePlayMode(); });
    playlistBtn.addEventListener('click', function (e) { e.stopPropagation(); openPlaylistModal(); });
    bar.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!audio.duration || !isFinite(audio.duration) || audio.duration <= 0) return;
      var rect = bar.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      pct = Math.max(0, Math.min(1, pct));
      audio.currentTime = pct * audio.duration;
    });

    return wrap;
  }

  /* 更新音乐卡 UI（不重绘整页，只更新子元素 style/textContent） */
  function updateMusicUI() {
    var cards = grid.querySelectorAll('[data-type="music"]');
    cards.forEach(function (card) {
      var player = card.querySelector('.music-player');
      if (!player) return;

      var track = getCurrentTrack();
      var emptyState = player.querySelector('.mp-empty-state');
      var coverImg = player.querySelector('.mp-cover img');
      var vinyl = player.querySelector('.mp-vinyl');
      var titleLine = player.querySelector('.mp-title-line');
      var titleEl = player.querySelector('.mp-title');
      var artistEl = player.querySelector('.mp-artist');
      var lyricsEl = player.querySelector('.mp-lyrics');
      var progress = player.querySelector('.mp-progress');
      var controls = player.querySelector('.mp-controls');
      var playBtn = player.querySelector('.mp-btn.main');
      var modeBtn = player.querySelector('.mp-mode');
      var fill = player.querySelector('.mp-progress-fill');
      var curTimeEl = player.querySelector('.mp-time-cur');
      var durTimeEl = player.querySelector('.mp-time-dur');

      if (!track) {
        if (emptyState) emptyState.style.display = '';
        if (coverImg) coverImg.style.display = 'none';
        if (vinyl) vinyl.style.display = 'none';
        if (titleLine) titleLine.style.display = 'none';
        if (lyricsEl) lyricsEl.style.display = 'none';
        if (progress) progress.style.display = 'none';
        if (controls) controls.style.display = 'none';
        return;
      }

      if (emptyState) emptyState.style.display = 'none';
      if (titleLine) titleLine.style.display = '';
      if (lyricsEl) lyricsEl.style.display = '';
      if (progress) progress.style.display = '';
      if (controls) controls.style.display = '';

      if (track.cover && coverImg) {
        coverImg.src = track.cover;
        coverImg.style.display = '';
        if (vinyl) vinyl.style.display = '';
      } else {
        if (coverImg) coverImg.style.display = 'none';
        if (vinyl) vinyl.style.display = 'none';
      }

      if (titleEl) titleEl.textContent = track.title || '未命名歌曲';
      if (artistEl) artistEl.textContent = track.artist ? (' - ' + track.artist) : '';
      if (lyricsEl) lyricsEl.textContent = track.lyrics || '';
      if (playBtn) playBtn.innerHTML = audio.paused ? ICON.play : ICON.pause;

      updateModeButton(modeBtn);

      var isMuted = state.muted || state.volume === 0;
      var iconSrc = isMuted ? ICON.volumeOff : ICON.volumeOn;
      card.querySelectorAll('.mp-vol-btn').forEach(function (b) { b.innerHTML = iconSrc; });
      card.querySelectorAll('.mp-vol-slider').forEach(function (s) {
        s.value = String(state.muted ? 0 : state.volume);
        updateVolumeSliderFill(s);
      });

      /* 关键：使用 safePct；元数据未加载完成时强制 0% */
      var cur = audioMetaLoaded ? audio.currentTime : 0;
      var dur = audioMetaLoaded ? audio.duration : 0;
      var pct = safePct(cur, dur);
      if (fill) fill.style.width = pct + '%';
      if (curTimeEl) curTimeEl.textContent = audioMetaLoaded ? formatTime(audio.currentTime) : '0:00';
      if (durTimeEl) durTimeEl.textContent = audioMetaLoaded ? formatTime(audio.duration) : '0:00';
    });
  }

  function showMusicError(msg) {
    grid.querySelectorAll('[data-type="music"] .mp-error').forEach(function (errEl) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
    });
  }
  function clearMusicError() {
    document.querySelectorAll('.mp-error').forEach(function (e) {
      e.style.display = 'none';
      e.textContent = '';
    });
  }

  function updateModeButton(btn) {
    if (!btn) return;
    var mode = state.playMode;
    var icon = ICON.modeSeq, label = '顺序';
    if (mode === 'loop-list') { icon = ICON.modeList; label = '列表'; }
    else if (mode === 'loop-single') { icon = ICON.modeSingle; label = '单曲'; }
    else if (mode === 'shuffle') { icon = ICON.modeShuffle; label = '随机'; }
    btn.innerHTML = icon + '<span style="margin-left:2px;">' + label + '</span>';
  }

  function getCurrentTrack() {
    if (!state.playlist || !state.playlist.length) return null;
    var t = state.playlist.find(function (x) { return x.id === state.currentTrackId; });
    if (!t) {
      t = state.playlist[0];
      state.currentTrackId = t.id;
    }
    return t;
  }

  function applyAudioVolume() {
    var v = typeof state.volume === 'number' ? state.volume : 0.8;
    if (v < 0) v = 0;
    if (v > 1) v = 1;
    audio.volume = v;
    audio.muted = !!state.muted;
  }

  function loadTrack(track, autoPlay) {
    if (!track) return;
    state.currentTrackId = track.id;
    save();
    clearMusicError();
    applyAudioVolume();
    audioMetaLoaded = false;
    if (track.audioUrl) {
      audio.src = track.audioUrl;
      audio.removeAttribute('crossorigin');
      audio.load();
      if (autoPlay) {
        var p = audio.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function (err) {
            console.error('[Audio Play Error]', err.name, err.message);
            if (err.name === 'NotAllowedError') showMusicError('需要先点击页面才能播放音频');
            else if (err.name === 'NotSupportedError') showMusicError('音频格式不支持，请尝试 MP3 或 OGG');
            else showMusicError('播放失败：' + (err.message || err.name));
          });
        }
      }
    } else {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      showMusicError('该歌曲还没有音频链接');
    }
    updateMusicUI();
  }

  function togglePlay() {
    var track = getCurrentTrack();
    if (!track) { toast('曲库为空'); return; }
    if (!track.audioUrl) { showMusicError('该歌曲还没有音频链接'); return; }

    clearMusicError();
    applyAudioVolume();

    if (audio.paused) {
      if (!audio.src || audio.src !== track.audioUrl) {
        audio.src = track.audioUrl;
        audio.removeAttribute('crossorigin');
        audio.load();
      }
      var p = audio.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function (err) {
          console.error('[Audio Play Error]', err.name, err.message);
          if (err.name === 'NotAllowedError') showMusicError('播放被浏览器阻止，请再点一次');
          else if (err.name === 'NotSupportedError') showMusicError('音频格式不支持或链接无效');
          else if (err.name === 'NetworkError') showMusicError('网络错误，音频加载失败');
          else showMusicError('播放失败：' + (err.message || err.name));
        });
      }
    } else {
      audio.pause();
    }
    updateMusicUI();
  }

  function playNext(manual) {
    if (!state.playlist.length) return;
    if (state.playMode === 'shuffle' && state.playlist.length > 1) {
      var idx;
      do { idx = Math.floor(Math.random() * state.playlist.length); }
      while (state.playlist[idx].id === state.currentTrackId);
      loadTrack(state.playlist[idx], true);
    } else {
      var curIdx = state.playlist.findIndex(function (t) { return t.id === state.currentTrackId; });
      if (curIdx < 0) curIdx = 0;
      var nextIdx = curIdx + 1;
      if (nextIdx >= state.playlist.length) {
        if (state.playMode === 'loop-list' || state.playMode === 'loop-single' || manual) nextIdx = 0;
        else { audio.pause(); return; }
      }
      loadTrack(state.playlist[nextIdx], true);
    }
  }

  function playPrev() {
    if (!state.playlist.length) return;
    var curIdx = state.playlist.findIndex(function (t) { return t.id === state.currentTrackId; });
    if (curIdx < 0) curIdx = 0;
    var prevIdx = curIdx - 1;
    if (prevIdx < 0) {
      if (state.playMode === 'loop-list' || state.playMode === 'loop-single') prevIdx = state.playlist.length - 1;
      else { audio.currentTime = 0; return; }
    }
    loadTrack(state.playlist[prevIdx], true);
  }

  function cyclePlayMode() {
    var modes = ['sequential', 'loop-list', 'loop-single', 'shuffle'];
    var idx = modes.indexOf(state.playMode);
    state.playMode = modes[(idx + 1) % modes.length];
    save();
    updateMusicUI();
    var names = { 'sequential':'顺序播放','loop-list':'列表循环','loop-single':'单曲循环','shuffle':'随机播放' };
    toast(names[state.playMode] || '');
  }

  /* ============ 音频事件 ============ */
  /* 关键修复：元数据加载完成前强制进度条为 0%，避免 NaN/Infinity 导致跳变 */
  audio.addEventListener('loadedmetadata', function () {
    audioMetaLoaded = true;
    updateMusicUI();
  });
  audio.addEventListener('durationchange', function () {
    if (isFinite(audio.duration) && audio.duration > 0) {
      audioMetaLoaded = true;
    }
    updateMusicUI();
  });
  audio.addEventListener('emptied', function () {
    audioMetaLoaded = false;
    /* 直接刷新进度条为 0% */
    grid.querySelectorAll('[data-type="music"] .mp-progress-fill').forEach(function (f) { f.style.width = '0%'; });
    grid.querySelectorAll('[data-type="music"] .mp-time-cur').forEach(function (el) { el.textContent = '0:00'; });
    grid.querySelectorAll('[data-type="music"] .mp-time-dur').forEach(function (el) { el.textContent = '0:00'; });
  });

  /* 关键：只用 safePct 计算，只更新 style，不触发整页重绘 */
  audio.addEventListener('timeupdate', function () {
    var pct = safePct(audio.currentTime, audio.duration);
    var pctStr = pct.toFixed(2) + '%';
    var curStr = audioMetaLoaded ? formatTime(audio.currentTime) : '0:00';
    var durStr = audioMetaLoaded ? formatTime(audio.duration) : '0:00';
    var fills = grid.querySelectorAll('[data-type="music"] .mp-progress-fill');
    fills.forEach(function (f) { f.style.width = pctStr; });
    var curEls = grid.querySelectorAll('[data-type="music"] .mp-time-cur');
    curEls.forEach(function (el) { el.textContent = curStr; });
    var durEls = grid.querySelectorAll('[data-type="music"] .mp-time-dur');
    durEls.forEach(function (el) { el.textContent = durStr; });
  });

  audio.addEventListener('error', function () {
    var e = audio.error;
    var msg = '音频加载失败';
    if (e) {
      if (e.code === 1) msg = '音频加载被中断';
      else if (e.code === 2) msg = '网络错误，请检查音频链接';
      else if (e.code === 3) msg = '音频解码失败，文件可能损坏';
      else if (e.code === 4) msg = '音频格式不支持或链接无效';
    }
    console.error('[Audio Error]', e);
    showMusicError(msg);
  });

  audio.addEventListener('playing', function () { clearMusicError(); updateMusicUI(); });
  audio.addEventListener('loadedmetadata', updateMusicUI);
  audio.addEventListener('play', function () { clearMusicError(); updateMusicUI(); });
  audio.addEventListener('pause', updateMusicUI);

  audio.addEventListener('volumechange', function () {
    grid.querySelectorAll('[data-type="music"]').forEach(function (card) {
      var isMuted = audio.muted || audio.volume === 0;
      var iconSrc = isMuted ? ICON.volumeOff : ICON.volumeOn;
      card.querySelectorAll('.mp-vol-btn').forEach(function (b) { b.innerHTML = iconSrc; });
    });
  });

  audio.addEventListener('ended', function () {
    if (state.playMode === 'loop-single') {
      audio.currentTime = 0;
      audio.play().catch(function () {});
    } else if (state.playMode === 'sequential') {
      var curIdx = state.playlist.findIndex(function (t) { return t.id === state.currentTrackId; });
      if (curIdx < state.playlist.length - 1) loadTrack(state.playlist[curIdx + 1], true);
      else updateMusicUI();
    } else if (state.playMode === 'loop-list') {
      var i = state.playlist.findIndex(function (t) { return t.id === state.currentTrackId; });
      loadTrack(state.playlist[(i + 1) % state.playlist.length], true);
    } else if (state.playMode === 'shuffle') {
      playNext(true);
    }
  });

  /* ============ 播放列表 & 曲库管理 ============ */
  function openPlaylistModal() {
    var html = '<div class="track-list">';
    if (!state.playlist.length) {
      html += '<p class="qa-empty">曲库为空，请先在设置中添加歌曲。</p>';
    } else {
      state.playlist.forEach(function (t) {
        var isCur = t.id === state.currentTrackId;
        html += '<div class="track-row' + (isCur ? ' current' : '') + '" data-id="' + t.id + '">' +
          '<div class="track-cover">' +
            (t.cover ? '<img src="' + t.cover + '" alt="">' : '<div class="img-empty" style="position:static;font-size:10px;">无封面</div>') +
          '</div>' +
          '<div class="track-info">' +
            '<div class="track-title">' + (t.title || '未命名') + '</div>' +
            '<div class="track-artist">' + (t.artist || '未知歌手') + '</div>' +
          '</div>' +
          '<div class="track-actions"><span style="font-size:11px;color:#9aa2ad;">' + (isCur ? '播放中' : '播放') + '</span></div>' +
        '</div>';
      });
    }
    html += '</div><div style="margin-top:14px;display:flex;justify-content:flex-end;"><button class="pbtn" id="openManagePlaylist" type="button">管理曲库</button></div>';
    openModal('播放列表', html);

    modalBody.querySelectorAll('.track-row').forEach(function (row) {
      row.addEventListener('click', function () {
        var track = state.playlist.find(function (t) { return t.id === row.dataset.id; });
        if (track) { loadTrack(track, true); closeModal(); }
      });
    });

    var manageBtn = document.getElementById('openManagePlaylist');
    if (manageBtn) manageBtn.addEventListener('click', function () { closeModal(); openManagePlaylistModal(); });
  }

  function openManagePlaylistModal() {
    var html = '<div id="playlistManager" class="track-list"></div>' +
      '<button class="padd" id="addTrackBtn" type="button">+ 添加歌曲</button>';
    openModal('管理曲库', html);

    var listEl = document.getElementById('playlistManager');
    var addBtn = document.getElementById('addTrackBtn');

    function renderManager() {
      listEl.innerHTML = '';
      if (!state.playlist.length) {
        var p = document.createElement('p');
        p.className = 'qa-empty';
        p.textContent = '还没有歌曲，点击下方添加。';
        listEl.appendChild(p);
      }
      state.playlist.forEach(function (t) {
        var item = document.createElement('div');
        item.className = 'manage-track';

        var top = document.createElement('div');
        top.className = 'manage-track-top';

        var cover = document.createElement('div');
        cover.className = 'manage-cover';
        if (t.cover) {
          var img = document.createElement('img');
          img.src = t.cover;
          cover.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'img-empty';
          ph.style.position = 'static';
          ph.style.fontSize = '10px';
          ph.textContent = '无封面';
          cover.appendChild(ph);
        }
        cover.title = '点击更换封面';
        cover.addEventListener('click', function () {
          var inp = document.createElement('input');
          inp.type = 'file'; inp.accept = 'image/*';
          inp.addEventListener('change', function () {
            var f = inp.files && inp.files[0];
            if (!f) return;
            readImageFile(f, 1000, function (url) {
              openCropper({
                src: url, aspect: 1, title: '裁剪封面', maxSize: 800,
                onConfirm: function (cropped) {
                  t.cover = cropped; save();
                  cover.innerHTML = '';
                  var im = document.createElement('img');
                  im.src = cropped;
                  cover.appendChild(im);
                  updateMusicUI();
                  toast('封面已更新');
                }
              });
            });
          });
          inp.click();
        });
        top.appendChild(cover);

        var fields = document.createElement('div');
        fields.className = 'manage-fields';

        ['title','artist','lyrics','audioUrl'].forEach(function (key, idx) {
          var inp = document.createElement('input');
          inp.className = 'pinput';
          inp.placeholder = ['歌名','歌手','歌词','音频链接（https://...mp3）'][idx];
          inp.value = t[key] || '';
          inp.addEventListener('input', function () {
            t[key] = inp.value;
            save();
            if (state.currentTrackId === t.id) updateMusicUI();
          });
          fields.appendChild(inp);
        });
        top.appendChild(fields);

        var actions = document.createElement('div');
        actions.className = 'track-actions';
        var delBtn = document.createElement('button');
        delBtn.className = 'pbtn danger';
        delBtn.type = 'button';
        delBtn.textContent = '删除';
        delBtn.addEventListener('click', function () {
          state.playlist = state.playlist.filter(function (x) { return x.id !== t.id; });
          if (state.currentTrackId === t.id) {
            state.currentTrackId = state.playlist[0] ? state.playlist[0].id : null;
            if (state.playlist.length) loadTrack(state.playlist[0], false);
            else {
              audio.pause();
              audio.removeAttribute('src');
              audio.load();
            }
          }
          save();
          render();
          renderManager();
        });
        actions.appendChild(delBtn);
        top.appendChild(actions);

        item.appendChild(top);
        listEl.appendChild(item);
      });
    }

    renderManager();

    addBtn.addEventListener('click', function () {
      var newTrack = { id: uid(), title: '新歌曲', artist: '未知歌手', lyrics: '', cover: '', audioUrl: '' };
      state.playlist.push(newTrack);
      if (!state.currentTrackId) state.currentTrackId = newTrack.id;
      save();
      render();
      renderManager();
      var last = listEl.lastElementChild;
      if (last) {
        last.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var ti = last.querySelector('.manage-fields input');
        if (ti) ti.focus();
      }
    });
  }

  /* ============ 悬浮挂件 ============ */
  function renderStickers() {
    stickerLayer.innerHTML = '';
    state.stickers.forEach(function (s) {
      var div = el('div', 'sticker');
      div.dataset.id = s.id;
      div.style.left = s.x + 'px';
      div.style.top = s.y + 'px';
      div.style.width = s.size + 'px';
      if (s.id === selectedStickerId) div.classList.add('selected');

      var img = el('img');
      img.src = s.image;
      img.alt = '';
      img.draggable = false;
      div.appendChild(img);

      var controls = el('div', 'sticker-controls');
      var slider = el('input');
      slider.type = 'range';
      slider.min = 40;
      slider.max = 300;
      slider.value = s.size;
      slider.addEventListener('input', function (e) {
        e.stopPropagation();
        s.size = Number(slider.value);
        div.style.width = s.size + 'px';
      });
      slider.addEventListener('change', function (e) {
        e.stopPropagation();
        var w = div.offsetWidth, h = div.offsetHeight;
        s.x = Math.min(s.x, window.innerWidth - w);
        s.y = Math.min(s.y, window.innerHeight - h);
        div.style.left = s.x + 'px';
        div.style.top = s.y + 'px';
        save();
      });
      controls.appendChild(slider);

      var del = el('button', 'sticker-del');
      del.type = 'button';
      del.title = '删除挂件';
      del.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        state.stickers = state.stickers.filter(function (x) { return x.id !== s.id; });
        if (selectedStickerId === s.id) selectedStickerId = null;
        save();
        renderStickers();
      });
      controls.appendChild(del);
      div.appendChild(controls);

      div.addEventListener('click', function (e) {
        if (!editMode) return;
        e.stopPropagation();
        selectedStickerId = s.id;
        stickerLayer.querySelectorAll('.sticker').forEach(function (el) {
          el.classList.toggle('selected', el.dataset.id === s.id);
        });
      });

      var dragging = false;
      var startX = 0, startY = 0, origX = 0, origY = 0;

      div.addEventListener('pointerdown', function (e) {
        if (!editMode) return;
        if (e.target.closest('.sticker-controls')) return;
        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origX = s.x;
        origY = s.y;
        try { div.setPointerCapture(e.pointerId); } catch (err) {}
        div.style.cursor = 'grabbing';
      });

      div.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        e.preventDefault();
        var nx = origX + (e.clientX - startX);
        var ny = origY + (e.clientY - startY);
        var w = div.offsetWidth, h = div.offsetHeight;
        nx = Math.max(0, Math.min(nx, window.innerWidth - w));
        ny = Math.max(0, Math.min(ny, window.innerHeight - h));
        div.style.left = nx + 'px';
        div.style.top = ny + 'px';
        s.x = nx;
        s.y = ny;
      });

      div.addEventListener('pointerup', function (e) {
        if (!dragging) return;
        dragging = false;
        try { div.releasePointerCapture(e.pointerId); } catch (err) {}
        div.style.cursor = 'grab';
        save();
      });

      div.addEventListener('pointercancel', function () {
        if (!dragging) return;
        dragging = false;
        div.style.cursor = 'grab';
        save();
      });

      stickerLayer.appendChild(div);
    });
  }

  function addSticker() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      readImageFile(f, 800, function (url) {
        openCropper({
          src: url,
          aspect: NaN,
          title: '裁剪挂件图片',
          maxSize: 600,
          onConfirm: function (cropped) {
            state.stickers.push({
              id: uid(),
              x: Math.round((window.innerWidth - 120) / 2),
              y: Math.round((window.innerHeight - 120) / 2),
              size: 120,
              image: cropped
            });
            save();
            renderStickers();
            toast('挂件已添加');
          }
        });
      });
    });
    inp.click();
  }

  /* ============ 富文本工具栏 ============ */
  var activeEditable = null;
  function showRte(target) {
    rteBar.classList.add('show');
    var rect = target.getBoundingClientRect();
    var bw = rteBar.offsetWidth, bh = rteBar.offsetHeight;
    var left = rect.left + rect.width / 2 - bw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
    var top = rect.top - bh - 8;
    if (top < 64) top = rect.bottom + 8;
    top = Math.max(60, Math.min(top, window.innerHeight - bh - 8));
    rteBar.style.left = left + 'px';

  var cropperInstance = null;

  function openCropper(opts) {
    if (typeof Cropper === 'undefined') { toast('裁剪库加载失败'); return; }
    var src = opts.src;
    var aspect = (typeof opts.aspect === 'number') ? opts.aspect : NaN;
    cropperTitle.textContent = opts.title || '裁剪图片';
    cropperCallback = opts.onConfirm || null;

    if (cropperInstance) { try { cropperInstance.destroy(); } catch (e) {} cropperInstance = null; }
    cropperImg.onload = null;
    cropperImg.removeAttribute('src');

    cropperMask.classList.add('show');
    document.body.style.overflow = 'hidden';

    cropperImg.src = src;
    cropperImg.onload = function () {
      if (cropperInstance) { try { cropperInstance.destroy(); } catch (e) {} cropperInstance = null; }
      cropperInstance = new Cropper(cropperImg, {
        viewMode: 1, dragMode: 'move', autoCropArea: 0.85,
        aspectRatio: aspect, background: false, responsive: true,
        restore: false, guides: true, center: true, highlight: false,
        cropBoxMovable: true, cropBoxResizable: true,
        toggleDragModeOnDblclick: false, wheelZoomRatio: 0.1,
        minContainerHeight: 260
      });
    };
  }

  function confirmCropper() {
    if (!cropperInstance) return;
    var canvas;
    try {
      canvas = cropperInstance.getCroppedCanvas({ maxWidth: 1600, maxHeight: 1600, imageSmoothingQuality: 'high' });
    } catch (e) { toast('裁剪失败'); return; }
    if (!canvas) { toast('裁剪失败'); return; }
    var hasAlpha = canvasHasAlpha(canvas);
    var dataUrl;
    try {
      if (hasAlpha) dataUrl = canvas.toDataURL('image/png');
      else dataUrl = canvas.toDataURL('image/jpeg', 0.88);
    } catch (e) { toast('输出失败'); return; }
    var cb = cropperCallback;
    closeCropper();
    if (cb) cb(dataUrl);
  }

    cropperImg.onload = null;

  }
